<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuki 團購入口</title>
  <meta name="description" content="Yuki 個人品牌團購入口，手機友善、快速查看開團資訊" />
  <style>
    :root{
      --bg:#ffffff;
      --text:#1f2430;
      --muted:#667085;
      --card:#f6f2ff;
      --line:#ebe5ff;
      --primary:#7c5cff;
      --primary-press:#6a4cf0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
      line-height:1.6;
    }
    .wrap{
      width:min(100%, 760px);
      margin:0 auto;
      padding:16px;
    }
    .hero{
      margin:8px 0 18px;
    }
    h1{
      font-size:32px;
      line-height:1.2;
      margin:0 0 8px;
    }
    .sub{
      margin:0;
      color:var(--muted);
      font-size:16px;
    }

    .section{
      margin:22px 0;
    }
    .section h2{
      margin:0 0 12px;
      font-size:24px;
      line-height:1.3;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      margin-bottom:12px;
    }
    .brand{
      font-weight:800;
      font-size:20px;
      margin-bottom:2px;
    }
    .name{
      font-size:18px;
      margin-bottom:6px;
    }
    .desc{
      margin:0 0 10px;
      color:#4b5565;
      font-size:15px;
    }
    .deadline{
      font-size:14px;
      color:#6f5ccf;
      margin-bottom:10px;
      font-weight:600;
    }
    .btn{
      display:block;
      width:100%;
      text-align:center;
      text-decoration:none;
      color:#fff;
      background:var(--primary);
      border-radius:12px;
      min-height:48px;
      padding:12px 14px;
      font-weight:700;
      font-size:17px;
    }
    .btn:active{ background:var(--primary-press); }

    .social-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .social{
      display:block;
      text-decoration:none;
      color:var(--text);
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      min-height:46px;
      padding:10px 12px;
      text-align:center;
      font-weight:600;
    }

    .footer{
      margin:24px 0 8px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    @media (min-width:768px){
      .wrap{ padding:24px; }
      .card{ padding:16px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>Yuki 團購入口</h1>
      <p class="sub">精選開團與長期推薦（手機優先）</p>
    </header>

    <section class="section">
      <h2>目前開團中</h2>

      <article class="card">
        <div class="brand">Brand A</div>
        <div class="name">商品名稱 A</div>
        <p class="desc">一句簡短介紹 A</p>
        <div class="deadline">截止：2026-08-20</div>
        <a class="btn" href="https://yang-0606.github.io/yuki/brand-a/">前往團購</a>
      </article>

      <article class="card">
        <div class="brand">Brand B</div>
        <div class="name">商品名稱 B</div>
        <p class="desc">一句簡短介紹 B</p>
        <div class="deadline">截止：2026-08-25</div>
        <a class="btn" href="https://yang-0606.github.io/yuki/brand-b/">前往團購</a>
      </article>

      <article class="card">
        <div class="brand">Brand C</div>
        <div class="name">商品名稱 C</div>
        <p class="desc">一句簡短介紹 C</p>
        <div class="deadline">截止：2026-08-30</div>
        <a class="btn" href="https://yang-0606.github.io/yuki/brand-c/">前往團購</a>
      </article>
    </section>

    <section class="section">
      <h2>社群連結</h2>
      <div class="social-grid">
        <a class="social" href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
        <a class="social" href="https://threads.net/" target="_blank" rel="noopener">Threads</a>
        <a class="social" href="https://youtube.com/" target="_blank" rel="noopener">YouTube</a>
        <a class="social" href="#" aria-disabled="true">Twitch（預留）</a>
      </div>
    </section>

    <p class="footer">© 2026 Yuki</p>
  </main>
</body>
</html>
