<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuki 團購入口</title>
  <meta name="description" content="Yuki 個人品牌團購入口，手機友善、快速查看開團資訊" />
  <style>
    :root{
      --bg:#ffffff;
      --text:#1f2430;
      --muted:#667085;
      --card:#f6f2ff;
      --line:#ebe5ff;
      --primary:#7c5cff;
      --primary-press:#6a4cf0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
      line-height:1.6;
    }
    .wrap{
      width:min(100%, 760px);
      margin:0 auto;
      padding:16px;
    }
    .hero{ margin:8px 0 18px; }
    h1{
      font-size:32px;
      line-height:1.2;
      margin:0 0 8px;
    }
    .sub{
      margin:0;
      color:var(--muted);
      font-size:16px;
    }

    .section{ margin:22px 0; }
    .section h2{
      margin:0 0 12px;
      font-size:24px;
      line-height:1.3;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      margin-bottom:12px;
    }
    .brand{
      font-weight:800;
      font-size:20px;
      margin-bottom:2px;
    }
    .name{
      font-size:18px;
      margin-bottom:6px;
    }
    .desc{
      margin:0 0 10px;
      color:#4b5565;
      font-size:15px;
    }
    .deadline{
      font-size:14px;
      color:#6f5ccf;
      margin-bottom:10px;
      font-weight:600;
    }
    .btn{
      display:block;
      width:100%;
      text-align:center;
      text-decoration:none;
      color:#fff;
      background:var(--primary);
      border-radius:12px;
      min-height:48px;
      padding:12px 14px;
      font-weight:700;
      font-size:17px;
      border:none;
    }
    .btn:active{ background:var(--primary-press); }

    .social-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .social{
      display:block;
      text-decoration:none;
      color:var(--text);
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      min-height:46px;
      padding:10px 12px;
      text-align:center;
      font-weight:600;
    }

    .empty{
      color:var(--muted);
      font-size:15px;
      padding:8px 2px;
    }

    .footer{
      margin:24px 0 8px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    @media (min-width:768px){
      .wrap{ padding:24px; }
      .card{ padding:16px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1 id="site-title">Yuki 團購入口</h1>
      <p class="sub" id="site-subtitle">精選開團與長期推薦（手機優先）</p>
    </header>

    <section class="section">
      <h2>目前開團中</h2>
      <div id="deals-list"></div>
    </section>

    <section class="section">
      <h2>社群連結</h2>
      <div id="social-list" class="social-grid"></div>
    </section>

    <p class="footer">© 2026 Yuki</p>
  </main>

  <script src="./data.js"></script>
  <script>
    (function () {
      const data = window.SITE_DATA || {};
      const profile = data.profile || {};
      const deals = Array.isArray(data.deals) ? data.deals : [];
      const socials = Array.isArray(data.socials) ? data.socials : [];

      // 基本資料
      if (profile.title) {
        document.getElementById("site-title").textContent = profile.title;
        document.title = profile.title;
      }
      if (profile.subtitle) {
        document.getElementById("site-subtitle").textContent = profile.subtitle;
      }

      // 開團卡片
      const dealsEl = document.getElementById("deals-list");
      if (!deals.length) {
        dealsEl.innerHTML = '<p class="empty">目前沒有開團，敬請期待。</p>';
      } else {
        dealsEl.innerHTML = deals.map(function (d) {
          return `
            <article class="card">
              <div class="brand">${escapeHtml(d.brand || "")}</div>
              <div class="name">${escapeHtml(d.name || "")}</div>
              <p class="desc">${escapeHtml(d.desc || "")}</p>
              <div class="deadline">截止：${escapeHtml(d.endAt || "-")}</div>
              <a class="btn" href="${escapeAttr(d.link || "#")}">前往團購</a>
            </article>
          `;
        }).join("");
      }

      // 社群
      const socialEl = document.getElementById("social-list");
      if (!socials.length) {
        socialEl.innerHTML = '<p class="empty">尚未設定社群連結。</p>';
      } else {
        socialEl.innerHTML = socials.map(function (s) {
          return `
            <a class="social" href="${escapeAttr(s.url || "#")}" target="_blank" rel="noopener">
              ${escapeHtml(s.name || "連結")}
            </a>
          `;
        }).join("");
      }

      function escapeHtml(str){
        return String(str)
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#39;");
      }
      function escapeAttr(str){
        return escapeHtml(str).replaceAll("`","&#96;");
      }
    })();
  </script>
</body>
</html>
