<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuki 團購入口</title>
  <meta name="description" content="Yuki 個人品牌團購入口" />
  <style>
    :root{
      --bg:#fff;
      --card:#f7f3ff;
      --primary:#8b6dff;
      --text:#222;
      --muted:#666;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
      background:var(--bg); color:var(--text); line-height:1.6;
    }
    .wrap{max-width:720px; margin:0 auto; padding:16px;}
    h1{font-size:28px; margin:8px 0 4px;}
    .sub{color:var(--muted); margin:0 0 20px;}
    .section{margin:24px 0;}
    .section h2{font-size:20px; margin:0 0 12px;}
    .card{background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px;}
    .brand{font-weight:700;}
    .name{margin:4px 0 8px;}
    .desc{color:var(--muted); font-size:14px; margin:0 0 10px;}
    .deadline{font-size:13px; color:#7a6bb3; margin-bottom:10px;}
    .btn{
      display:inline-block; width:100%; text-align:center;
      background:var(--primary); color:#fff; text-decoration:none;
      border-radius:12px; padding:12px 14px; min-height:44px; font-weight:600;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Yuki 團購入口</h1>
    <p class="sub">精選開團與長期推薦（手機友善）</p>

    <section class="section">
      <h2>目前開團中</h2>

      <article class="card">
        <div class="brand">Brand A</div>
        <div class="name">商品名稱 A</div>
        <p class="desc">一句簡短介紹 A</p>
        <div class="deadline">截止：2026-08-20</div>
        <a class="btn" href="https://yang-0606.github.io/yuki/brand-a/">前往團購</a>
      </article>

      <article class="card">
        <div class="brand">Brand B</div>
        <div class="name">商品名稱 B</div>
        <p class="desc">一句簡短介紹 B</p>
        <div class="deadline">截止：2026-08-25</div>
        <a class="btn" href="https://yang-0606.github.io/yuki/brand-b/">前往團購</a>
      </article>

      <article class="card">
        <div class="brand">Brand C</div>
        <div class="name">商品名稱 C</div>
        <p class="desc">一句簡短介紹 C</p>
        <div class="deadline">截止：2026-08-30</div>
        <a class="btn" href="https://yang-0606.github.io/yuki/brand-c/">前往團購</a>
      </article>
    </section>
  </main>
</body>
</html>
